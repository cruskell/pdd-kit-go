name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use canonical runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - run: test -z "$(gofmt -l cmd internal examples)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/pdd ./cmd/pdd
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Pull pinned Gobra
        run: docker pull ghcr.io/viperproject/gobra@sha256:5e96431b06c2e6209aa767df9153bb4cf8b2620598598f1d7d3f3a74c09c14f9
      - name: Real verifier integration
        run: PDD_INTEGRATION=1 go test ./internal/pdd -run 'TestGobra.*Integration' -v -count=1
      - run: go build -o bin/pdd ./cmd/pdd
      - run: bin/pdd lint
      - name: Import committed example review (no approval is created in CI)
        run: bin/pdd import-approval --from .pdd/reviews/default.json
      - name: Prove demo and check mutations through the JSON API
        run: bin/pdd prove --json > .pdd/prove-result.json
      - name: Check current machine-readable result
        run: |
          bin/pdd status --json > .pdd/status-result.json
          python3 - <<'PYTHON'
          import json
          for name in ('prove', 'status'):
              with open(f'.pdd/{name}-result.json') as file:
                  result = json.load(file)
              assert result['schema'] == 1 and result['command'] == name
              assert result['ok'] is True and result['exit_code'] == 0
              assert result['plan'] == 'default' and result['data']['current'] is True
              assert result['data']['receipt']['success'] is True
          PYTHON
      - name: Verify HTTP application using preserved review
        run: |
          bin/pdd --plan httpwallet init --from examples/httpwallet/plan.json
          bin/pdd --plan httpwallet import-approval --from .pdd/reviews/httpwallet.json
          bin/pdd --plan httpwallet prove --json > .pdd/httpwallet-prove-result.json
          bin/pdd --plan httpwallet status --json > .pdd/httpwallet-status-result.json
          python3 - <<'PYTHON'
          import json
          for command in ('prove', 'status'):
              with open(f'.pdd/httpwallet-{command}-result.json') as file:
                  result = json.load(file)
              assert result['ok'] and result['exit_code'] == 0
              assert result['data']['current'] and result['data']['receipt']['success']
              assert result['data']['receipt']['approval']['reviewer'] == 'codex-example-review'
          PYTHON
      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipts
          path: |
            .pdd/receipts/
            .pdd/state/httpwallet/receipts/
            .pdd/*-result.json
          if-no-files-found: warn
          include-hidden-files: true
  authenticated-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUSTED_REVIEW_POLICY_JSON: ${{ vars.PDD_REVIEW_POLICY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
      - name: Checkout independently pinned verifier orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4fe69675096a9e270ca3b97b8563d52a7c045af0
          path: trusted-tooling
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Build trusted CLI
        working-directory: trusted-tooling
        run: go build -ldflags '-X main.version=v0.2.0-policy-gate' -o ../pdd-trusted ./cmd/pdd
      - name: Read public authority policy from independently managed repository variable
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          policy = json.loads(os.environ['TRUSTED_REVIEW_POLICY_JSON'])
          assert policy['schema'] == 1 and policy['reviewers']
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-policy.json').write_text(json.dumps(policy))
          PYTHON
      - name: Pull pinned Gobra
        run: docker pull ghcr.io/viperproject/gobra@sha256:5e96431b06c2e6209aa767df9153bb4cf8b2620598598f1d7d3f3a74c09c14f9
      - name: Repeat signed verification without a private key or CI approval
        run: |
          set -euo pipefail
          for plan in validation httpwallet; do
            gate=(./pdd-trusted --cwd target --plan "$plan" --policy "$RUNNER_TEMP/review-policy.json")
            "${gate[@]}" init --from "examples/${plan}/plan.json"
            "${gate[@]}" import-approval --from ".pdd/reviews/${plan}-signed.json"
            mkdir -p target/.pdd/results
            for attempt in 1 2 3; do
              "${gate[@]}" prove --json > "target/.pdd/results/gate-${plan}-${attempt}-prove.json"
              "${gate[@]}" status --json > "target/.pdd/results/gate-${plan}-${attempt}-status.json"
            done
            if PDD_REVIEW_POLICY= ./pdd-trusted --cwd target --plan "$plan" status --json > "target/.pdd/results/gate-${plan}-no-policy.json"; then
              echo 'Signed gate unexpectedly accepted a missing policy' >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authenticated-gate-evidence
          path: |
            target/.pdd/state/validation/receipts/
            target/.pdd/state/httpwallet/receipts/
            target/.pdd/results/gate-*.json
          include-hidden-files: true
          if-no-files-found: warn
