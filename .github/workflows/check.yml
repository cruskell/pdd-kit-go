name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: test -z "$(gofmt -l cmd internal examples)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/pdd ./cmd/pdd
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Pull pinned Gobra
        run: docker pull ghcr.io/viperproject/gobra@sha256:5e96431b06c2e6209aa767df9153bb4cf8b2620598598f1d7d3f3a74c09c14f9
      - name: Real verifier integration
        run: PDD_INTEGRATION=1 go test ./internal/pdd -run 'TestGobra.*Integration' -v -count=1
      - run: go build -o bin/pdd ./cmd/pdd
      - run: bin/pdd lint
      - name: Record demo-only approval (not production review)
        run: bin/pdd approve --reviewer ci-demo --accept-tcb identity-inputs
      - name: Prove demo and check mutations through the JSON API
        run: bin/pdd prove --json > .pdd/prove-result.json
      - name: Check current machine-readable result
        run: |
          bin/pdd status --json > .pdd/status-result.json
          python3 - <<'PYTHON'
          import json
          for name in ('prove', 'status'):
              with open(f'.pdd/{name}-result.json') as file:
                  result = json.load(file)
              assert result['schema'] == 1 and result['command'] == name
              assert result['ok'] is True and result['exit_code'] == 0
              assert result['plan'] == 'default' and result['data']['current'] is True
              assert result['data']['receipt']['success'] is True
          PYTHON
      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: proof-receipts
          path: |
            .pdd/receipts/
            .pdd/*-result.json
          if-no-files-found: warn
          include-hidden-files: true
